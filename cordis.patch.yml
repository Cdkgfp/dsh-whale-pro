# ============================================================================
# dsh-whale-compact —— DSH bundle patch
# ============================================================================
# 这是插件的“挂载声明”。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件会把小鲸鱼简洁版挂件插入 DSH 配置树。
#
# 安装（Web）：
#   dsh plugin --profile web add github:Cdkgfp/dsh-whale-compact
# 或本地开发：
#   dsh plugin --profile web add link:<本目录绝对路径>
#
# 桌面端（desktop profile）请使用宿主内置的 plugin_manager，不要直接执行
# `dsh plugin --profile desktop ...`。
# ============================================================================

- insert:
    - id: dsh-whale-compact
      name: dsh-whale-compact
